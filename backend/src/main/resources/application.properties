spring.application.name=lic-reminder-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lic_reminder?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.timezone=${APP_TIMEZONE:Asia/Calcutta}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}

notification.sms.enabled=${NOTIFICATION_SMS_ENABLED:false}
notification.sms.schedule=${NOTIFICATION_SMS_SCHEDULE:0 0 9 * * *}
notification.sms.account-sid=${NOTIFICATION_SMS_ACCOUNT_SID:}
notification.sms.auth-token=${NOTIFICATION_SMS_AUTH_TOKEN:}
notification.sms.from-number=${NOTIFICATION_SMS_FROM_NUMBER:}

notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:true}
notification.email.to=${NOTIFICATION_EMAIL_TO:20pa1a5448@vishnu.edu.in}
